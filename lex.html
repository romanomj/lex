<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8s Cluster 3D World</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0b0f;
            font-family: 'Outfit', sans-serif;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(13, 13, 18, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #e2e8f0;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 320px;
            pointer-events: auto;
            z-index: 10;
            transition: all 0.3s ease;
        }

        #ui-container h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 20px;
        }

        .instructions {
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.5;
        }

        .instructions strong {
            color: #3b82f6;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            user-select: none;
            z-index: 100;
            transition: transform 0.1s ease, border-color 0.1s ease, box-shadow 0.1s ease;
        }

        #crosshair.active {
            transform: translate(-50%, -50%) scale(1.6);
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
        }

        /* Hover HUD Card */
        #hud-tooltip {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 340px;
            background: rgba(13, 13, 18, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            color: #f1f5f9;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            z-index: 10;
            transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(10px);
            opacity: 0;
            pointer-events: none;
        }

        #hud-tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .hud-type {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.15);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .hud-title {
            font-size: 18px;
            font-weight: 800;
            margin-top: 8px;
            word-break: break-all;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -0.5px;
        }

        .hud-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 14px;
        }

        .hud-meta-row:last-child {
            border-bottom: none;
        }

        .hud-label {
            color: #94a3b8;
            font-weight: 400;
        }

        .hud-value {
            font-weight: 600;
            color: #f1f5f9;
        }

        /* Status badge styling */
        .badge {
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            background: rgba(148, 163, 184, 0.15);
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .badge-running {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .badge-pending,
        .badge-containercreating {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .badge-failed,
        .badge-error,
        .badge-crashloopbackoff,
        .badge-imagepullbackoff {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .badge-succeeded,
        .badge-completed {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        /* Resource Bar */
        .resource-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-top: 6px;
            overflow: hidden;
        }

        .resource-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        /* Stats Panel Styles */
        #stats-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(13, 13, 18, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #e2e8f0;
            padding: 12px 24px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
            transition: all 0.3s ease;
            min-width: 380px;
        }

        #stats-panel:hover {
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 12px 40px 0 rgba(59, 130, 246, 0.15);
        }

        .stats-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #94a3b8;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
            padding-bottom: 6px;
            justify-content: center;
        }

        .stats-cluster-icon {
            color: #3b82f6;
            font-size: 16px;
            text-shadow: 0 0 8px rgba(59, 130, 246, 0.5);
            animation: pulse-glow 2s infinite ease-in-out;
        }

        .stats-cluster-name {
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
        }

        .stats-grid {
            display: flex;
            gap: 24px;
            justify-content: space-around;
            width: 100%;
            padding-top: 4px;
        }

        .stats-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stats-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .stats-val {
            font-size: 18px;
            font-weight: 800;
            color: #f1f5f9;
            font-family: 'JetBrains Mono', monospace;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }
    </style>
    <!-- Import maps polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>

<body>

    <div id="ui-container">
        <h3>K8s 3D Cluster Environment</h3>
        <p class="instructions">
            <strong>Click screen</strong> to lock mouse and look around.<br>
            <strong>WASD / Arrow Keys:</strong> Move around<br>
            <strong>Space / Shift:</strong> Fly Up / Down<br>
            <strong>ESC:</strong> Exit mouse lock
        </p>
        <div id="node-info" style="margin-top: 10px; font-size: 12px;"></div>
    </div>

    <div id="stats-panel">
        <div class="stats-header">
            <span class="stats-cluster-icon">⎈</span>
            <span class="stats-cluster-name" id="stats-cluster-name">ClusterNamePlaceHolder</span>
        </div>
        <div class="stats-grid">
            <div class="stats-item">
                <span class="stats-label">Nodes</span>
                <span class="stats-val" id="stats-nodes">-</span>
            </div>
            <div class="stats-item">
                <span class="stats-label">Pods</span>
                <span class="stats-val" id="stats-pods">-</span>
            </div>
            <div class="stats-item">
                <span class="stats-label">Total Memory</span>
                <span class="stats-val" id="stats-memory">-</span>
            </div>
        </div>
    </div>

    <div id="hud-tooltip"></div>
    <div id="crosshair"></div>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // 1. Mock Kubernetes Cluster Configuration Data (Normalized to GB)
        let clusterData = {
            clusterName: "ClusterNamePlaceHolder",
            nodes: [
                {
                    name: "node-alpha",
                    maxMemoryGB: 24,
                    maxCPUCores: 8,
                    pods: [
                        { name: "frontend-pod-7d4f9b8c-2x9v4", memoryGB: 12, cpuCores: 4, color: 0x00f0ff, status: "Running", namespace: "production" },
                        { name: "backend-pod-5c8e7a1b-9p3k8", memoryGB: 4, cpuCores: 2, color: 0x3b82f6, status: "Running", namespace: "production" },
                        { name: "cache-pod-9a3f2c7d-5m1q9", memoryGB: 4, cpuCores: 1, color: 0xec4899, status: "Pending", namespace: "production" }
                    ]
                },
                {
                    name: "node-bravo",
                    maxMemoryGB: 16,
                    maxCPUCores: 4,
                    pods: [
                        { name: "db-pod-0-8b6d4c2e-4w8z7", memoryGB: 8, cpuCores: 2, color: 0xf59e0b, status: "Running", namespace: "database" },
                        { name: "db-pod-1-8b6d4c2e-5x9a2", memoryGB: 8, cpuCores: 2, color: 0x10b981, status: "Running", namespace: "database" }
                    ]
                },
                {
                    name: "node-charlie",
                    maxMemoryGB: 32,
                    maxCPUCores: 16,
                    pods: [
                        { name: "analytics-worker-6f9e8d7c-8y2v4", memoryGB: 16, cpuCores: 8, color: 0x8b5cf6, status: "Running", namespace: "analytics" },
                        { name: "logging-agent-3a5b7c9d-1r4q8", memoryGB: 4, cpuCores: 1, color: 0x6b7280, status: "Running", namespace: "kube-system" }
                    ]
                }
            ]
        };

        // 2. Scene Variables & Initialization
        let scene, camera, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let moveUp = false, moveDown = false;

        let oceanGeometry, oceanMesh, sunGroup, sunMesh;

        const clock = new THREE.Clock();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        const wallMaterial = new THREE.MeshStandardMaterial({
            color: 0x2c2e35, // Sleek premium slate-charcoal gray
            roughness: 0.2,
            metalness: 0.8,
            transparent: false,
            opacity: 1.0,
            side: THREE.DoubleSide
        });
        const partitionMaterial = new THREE.MeshStandardMaterial({
            color: 0x3a3d45, // Sleek matching dark gray floor slab
            roughness: 0.2,
            metalness: 0.5,
            transparent: false,
            opacity: 1.0,
            side: THREE.DoubleSide
        });
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
        const unallocatedMaterial = new THREE.MeshStandardMaterial({
            color: 0x4b5563,
            roughness: 0.8,
            transparent: false,
            opacity: 1.0,
            wireframe: true
        });

        // Phase 1: Interactive Polish Globals
        const colliders = [];
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(0, 0); // Raycast from center of screen

        // Procedural Sand Texture Generator using an HTML5 Canvas
        function createSandTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Base sand color
            ctx.fillStyle = '#e8d3a7';
            ctx.fillRect(0, 0, 256, 256);

            // Add subtle sand grain noise
            for (let i = 0; i < 6000; i++) {
                const x = Math.random() * 256;
                const y = Math.random() * 256;
                const size = Math.random() * 1.2 + 0.4;
                const r = Math.random();
                if (r < 0.3) {
                    ctx.fillStyle = '#eed9b3'; // lighter grain
                } else if (r < 0.6) {
                    ctx.fillStyle = '#dfc193'; // darker grain
                } else {
                    ctx.fillStyle = '#e0c79b'; // midtone grain
                }
                ctx.fillRect(x, y, size, size);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(16, 16);
            return texture;
        }

        function updateStatsPanel() {
            const clusterName = clusterData.clusterName || "ClusterNamePlaceHolder";
            const totalNodes = clusterData.nodes ? clusterData.nodes.length : 0;
            
            let totalPods = 0;
            let totalMemory = 0;
            
            if (clusterData.nodes) {
                clusterData.nodes.forEach(node => {
                    if (node.pods) {
                        totalPods += node.pods.length;
                    }
                    totalMemory += node.maxMemoryGB || 0;
                });
            }
            
            // Format memory to 1 decimal place
            const formattedMemory = Math.round(totalMemory * 10) / 10;
            
            document.getElementById('stats-cluster-name').textContent = clusterName;
            document.getElementById('stats-nodes').textContent = totalNodes;
            document.getElementById('stats-pods').textContent = totalPods;
            document.getElementById('stats-memory').textContent = `${formattedMemory} GB`;
        }

        init();

        // Dynamically load live cluster data with local fallback
        fetch('cluster_state.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                console.log("Successfully loaded live cluster state:", data);
                if (data && Array.isArray(data.nodes)) {
                    clusterData = data;
                }
                const nodeInfo = document.getElementById('node-info');
                if (nodeInfo) {
                    nodeInfo.innerHTML = `
                        <span style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; background: rgba(16, 185, 129, 0.12); color: #10b981; font-size: 11px; font-weight: 700; border: 1px solid rgba(16, 185, 129, 0.2); text-transform: uppercase; letter-spacing: 0.5px;">
                            <span style="width: 6px; height: 6px; border-radius: 50%; background: #10b981; display: inline-block; box-shadow: 0 0 8px #10b981;"></span>
                            Live Cluster
                        </span>
                    `;
                }
                updateStatsPanel();
                generateClusterWorld();
                animate();
            })
            .catch(error => {
                console.warn("Could not fetch cluster_state.json (falling back to static mock configuration). Reason:", error.message);
                const nodeInfo = document.getElementById('node-info');
                if (nodeInfo) {
                    nodeInfo.innerHTML = `
                        <span style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; background: rgba(245, 158, 11, 0.12); color: #f59e0b; font-size: 11px; font-weight: 700; border: 1px solid rgba(245, 158, 11, 0.2); text-transform: uppercase; letter-spacing: 0.5px;">
                            <span style="width: 6px; height: 6px; border-radius: 50%; background: #f59e0b; display: inline-block; box-shadow: 0 0 8px #f59e0b;"></span>
                            Demo Mode
                        </span>
                    `;
                }
                updateStatsPanel();
                generateClusterWorld();
                animate();
            });

        function init() {
            scene = new THREE.Scene();
            // Ambient sky blue background and soft horizon fog
            scene.background = new THREE.Color(0x8bc0f4);
            scene.fog = new THREE.FogExp2(0x8bc0f4, 0.002);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2.5, 20); // Initial player position (gameplay height)

            // Lighting
            // Hemisphere light for realistic sky/ground ambient light contribution
            const hemiLight = new THREE.HemisphereLight(0x8bc0f4, 0xe8d3a7, 0.6);
            scene.add(hemiLight);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            // Warm Directional Sun Light positioned in alignment with the sun
            const dirLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
            dirLight.position.set(50, 100, 400);
            scene.add(dirLight);

            // Ground - Sandy Beach Platform Island
            const sandTexture = createSandTexture();
            const beachGeo = new THREE.BoxGeometry(250, 4, 250);
            const beachMat = new THREE.MeshStandardMaterial({
                map: sandTexture,
                roughness: 0.95,
                metalness: 0.05
            });
            const beach = new THREE.Mesh(beachGeo, beachMat);
            beach.position.set(0, -2, 0); // Top surface is at y = 0
            scene.add(beach);



            // Large surrounding Animated Ocean
            const oceanMat = new THREE.MeshStandardMaterial({
                color: 0x0077be,
                roughness: 0.1,
                metalness: 0.8,
                transparent: true,
                opacity: 0.85,
                side: THREE.DoubleSide
            });
            oceanGeometry = new THREE.PlaneGeometry(2000, 2000, 40, 40);
            oceanMesh = new THREE.Mesh(oceanGeometry, oceanMat);
            oceanMesh.rotation.x = -Math.PI / 2;
            oceanMesh.position.set(0, -1.2, 0); // Sits slightly below beach top
            scene.add(oceanMesh);

            // Glowing Sun with Concentric Billboard Halo Rings
            sunGroup = new THREE.Group();
            sunGroup.position.set(50, 100, 400);

            // Core sun sphere
            const sunGeo = new THREE.SphereGeometry(15, 32, 32);
            const sunMat = new THREE.MeshBasicMaterial({ color: 0xfffaed });
            sunMesh = new THREE.Mesh(sunGeo, sunMat);
            sunGroup.add(sunMesh);

            // Outer glow ring 1
            const glowGeo1 = new THREE.RingGeometry(16, 28, 32);
            const glowMat1 = new THREE.MeshBasicMaterial({
                color: 0xffe8bd,
                transparent: true,
                opacity: 0.35,
                side: THREE.DoubleSide
            });
            const glowMesh1 = new THREE.Mesh(glowGeo1, glowMat1);
            sunGroup.add(glowMesh1);

            // Outer glow ring 2
            const glowGeo2 = new THREE.RingGeometry(28, 45, 32);
            const glowMat2 = new THREE.MeshBasicMaterial({
                color: 0xffd08a,
                transparent: true,
                opacity: 0.15,
                side: THREE.DoubleSide
            });
            const glowMesh2 = new THREE.Mesh(glowGeo2, glowMat2);
            sunGroup.add(glowMesh2);

            scene.add(sunGroup);

            // Setup Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // First Person Pointer Lock Controls
            controls = new PointerLockControls(camera, renderer.domElement);

            document.body.addEventListener('click', () => {
                controls.lock();
            });

            // Input Listeners
            const onKeyDown = (event) => {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW': moveForward = true; break;
                    case 'ArrowLeft':
                    case 'KeyA': moveLeft = true; break;
                    case 'ArrowDown':
                    case 'KeyS': moveBackward = true; break;
                    case 'ArrowRight':
                    case 'KeyD': moveRight = true; break;
                    case 'Space': moveUp = true; break;
                    case 'ShiftLeft':
                    case 'ShiftRight': moveDown = true; break;
                }
            };

            const onKeyUp = (event) => {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW': moveForward = false; break;
                    case 'ArrowLeft':
                    case 'KeyA': moveLeft = false; break;
                    case 'ArrowDown':
                    case 'KeyS': moveBackward = false; break;
                    case 'ArrowRight':
                    case 'KeyD': moveRight = false; break;
                    case 'Space': moveUp = false; break;
                    case 'ShiftLeft':
                    case 'ShiftRight': moveDown = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            window.addEventListener('resize', onWindowResize);
        }

        // 3. Procedural Map Generation Logic
        function generateClusterWorld() {
            const buildingWidth = 12;      // Fixed width for every node structure
            const buildingDepth = 12;      // Fixed depth for every node structure
            const heightScale = 0.8;       // Height scale: 1GB memory matches 0.8 units in height
            const wallThickness = 0.4;     // Thickness of structural walls
            const spacing = 10;            // Gap space between buildings

            const usableBeachWidth = 200;  // Beach is 250x250, so 200 leaves a 25-unit border on all sides
            const maxCols = Math.floor((usableBeachWidth + spacing) / (buildingWidth + spacing)); // Math.floor(210 / 22) = 9 cols

            const N = clusterData.nodes.length;
            const numCols = Math.min(N, maxCols);
            const numRows = Math.ceil(N / maxCols);

            const gridWidth = numCols * buildingWidth + (numCols - 1) * spacing;
            const gridDepth = numRows * buildingDepth + (numRows - 1) * spacing;

            let minX = Infinity;
            let maxX = -Infinity;
            let minZ = Infinity;

            clusterData.nodes.forEach((node, index) => {
                // Calculate position in the grid (filling columns first, then rows)
                const row = Math.floor(index / maxCols);
                const col = index % maxCols;

                const x = col * (buildingWidth + spacing) - (gridWidth - buildingWidth) / 2;
                // Center the Z rows around 0. The row 0 will be the front-most row.
                // Building spans from z to z + buildingDepth.
                const z = row * (buildingDepth + spacing) - gridDepth / 2;

                // Calculate dynamic building height derived from maximum memory capacity
                const nodeWallHeight = node.maxMemoryGB * heightScale;

                // Track physical boundaries to spawn player safely outside
                const halfW = buildingWidth / 2 + wallThickness;
                const nodeMinX = x - halfW;
                const nodeMaxX = x + halfW;
                if (nodeMinX < minX) minX = nodeMinX;
                if (nodeMaxX > maxX) maxX = nodeMaxX;
                if (z < minZ) minZ = z;

                // Group representing our single structural node container
                const nodeBuilding = new THREE.Group();
                nodeBuilding.position.set(x, 0, z);

                // Calculate metadata for node interaction
                const totalAllocatedMemory = node.pods.reduce((sum, p) => sum + p.memoryGB, 0);
                const totalAllocatedCPU = node.pods.reduce((sum, p) => sum + (p.cpuCores || 0), 0);
                const nodeMetadata = {
                    type: "node",
                    nodeName: node.name,
                    maxMemoryGB: node.maxMemoryGB,
                    maxCPUCores: node.maxCPUCores || null,
                    allocatedMemory: Math.round(totalAllocatedMemory * 10) / 10,
                    allocatedCPU: Math.round(totalAllocatedCPU * 10) / 10,
                    podsCount: node.pods.length
                };

                // --- Outer Shell Construction (No Roof Box) ---
                // Outer Left & Right Structural Walls
                const sideWallGeo = new THREE.BoxGeometry(wallThickness, nodeWallHeight, buildingDepth);

                const leftWall = new THREE.Mesh(sideWallGeo, wallMaterial);
                leftWall.position.set(-buildingWidth / 2, nodeWallHeight / 2, buildingDepth / 2);
                leftWall.userData = nodeMetadata;
                nodeBuilding.add(leftWall);

                // Add glowing outline to left wall for premium wireframe styling
                const leftWallEdges = new THREE.EdgesGeometry(sideWallGeo);
                const leftWallLineMat = new THREE.LineBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.35 });
                const leftWallLine = new THREE.LineSegments(leftWallEdges, leftWallLineMat);
                leftWallLine.position.copy(leftWall.position);
                nodeBuilding.add(leftWallLine);

                const rightWall = new THREE.Mesh(sideWallGeo, wallMaterial);
                rightWall.position.set(buildingWidth / 2, nodeWallHeight / 2, buildingDepth / 2);
                rightWall.userData = nodeMetadata;
                nodeBuilding.add(rightWall);

                // Add glowing outline to right wall
                const rightWallEdges = new THREE.EdgesGeometry(sideWallGeo);
                const rightWallLineMat = new THREE.LineBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.35 });
                const rightWallLine = new THREE.LineSegments(rightWallEdges, rightWallLineMat);
                rightWallLine.position.copy(rightWall.position);
                nodeBuilding.add(rightWallLine);

                // Back panel relative to player (at Z = buildingDepth)
                const frontWallGeo = new THREE.BoxGeometry(buildingWidth + wallThickness, nodeWallHeight, wallThickness);
                const frontWall = new THREE.Mesh(frontWallGeo, wallMaterial);
                frontWall.position.set(0, nodeWallHeight / 2, buildingDepth);
                frontWall.userData = nodeMetadata;
                nodeBuilding.add(frontWall);

                // Add glowing outline to back panel
                const frontWallEdges = new THREE.EdgesGeometry(frontWallGeo);
                const frontWallLineMat = new THREE.LineBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.35 });
                const frontWallLine = new THREE.LineSegments(frontWallEdges, frontWallLineMat);
                frontWallLine.position.copy(frontWall.position);
                nodeBuilding.add(frontWallLine);



                // --- Room Segmentation (Pods Layout) ---
                let currentYOffset = 0;
                let allocatedMemory = 0;

                node.pods.forEach((pod) => {
                    const podHeight = pod.memoryGB * heightScale;
                    const marginY = Math.min(0.05, podHeight * 0.05);

                    // Render individual pod unit as a glassmorphic 3D Box filling the room container floor/ceiling height
                    const podGeo = new THREE.BoxGeometry(
                        buildingWidth - wallThickness - 0.2, // leave margin on sides to prevent outer wall intersection
                        podHeight - marginY * 2,            // leave margin on top/bottom to prevent floor partition intersection
                        buildingDepth - wallThickness - 0.2  // leave margin on depth to prevent front/back wall intersection
                    );
                    const podMat = new THREE.MeshStandardMaterial({
                        color: pod.color,
                        roughness: 0.2,
                        metalness: 0.1,
                        transparent: false,
                        opacity: 1.0,
                        side: THREE.DoubleSide
                    });
                    const podBox = new THREE.Mesh(podGeo, podMat);
                    // Position at the core center of this pod's allocated zone section, stacked vertically
                    podBox.position.set(0, currentYOffset + (podHeight / 2), buildingDepth / 2);

                    // Attach pod metadata
                    podBox.userData = {
                        type: "pod",
                        podName: pod.name,
                        nodeName: node.name,
                        memoryGB: pod.memoryGB,
                        cpuCores: pod.cpuCores || null,
                        color: pod.color,
                        status: pod.status,
                        namespace: pod.namespace,
                        nodeMaxMemory: node.maxMemoryGB,
                        nodeMaxCPUCores: node.maxCPUCores || null
                    };
                    nodeBuilding.add(podBox);

                    // Add high-tech holographic wireframe outlines to the glassmorphic pod box
                    const edges = new THREE.EdgesGeometry(podGeo);
                    const lineMat = new THREE.LineBasicMaterial({ color: pod.color, transparent: true, opacity: 0.8 });
                    const line = new THREE.LineSegments(edges, lineMat);
                    line.position.copy(podBox.position);
                    nodeBuilding.add(line);

                    // Move offset up
                    currentYOffset += podHeight;
                    allocatedMemory += pod.memoryGB;

                    // Slice Internal Partition Floor Slab (Placed between stacked pod rooms)
                    const partitionThickness = 0.15;
                    const partitionGeo = new THREE.BoxGeometry(buildingWidth - wallThickness, partitionThickness, buildingDepth - wallThickness);
                    const partition = new THREE.Mesh(partitionGeo, partitionMaterial);
                    partition.position.set(0, currentYOffset, buildingDepth / 2);
                    // Partitions have custom type so they don't block vertical flying inside
                    partition.userData = {
                        type: "partition",
                        nodeName: node.name
                    };
                    nodeBuilding.add(partition);

                    // Add glowing outline to partition floor slab
                    const partitionEdges = new THREE.EdgesGeometry(partitionGeo);
                    const partitionLineMat = new THREE.LineBasicMaterial({ color: 0x475569, transparent: true, opacity: 0.35 });
                    const partitionLine = new THREE.LineSegments(partitionEdges, partitionLineMat);
                    partitionLine.position.copy(partition.position);
                    nodeBuilding.add(partitionLine);
                });

                // --- Handle Leftover/Unallocated Cluster Node Resources ---
                if (allocatedMemory < node.maxMemoryGB) {
                    const leftoverMemory = node.maxMemoryGB - allocatedMemory;
                    const leftoverHeight = leftoverMemory * heightScale;
                    const leftoverMarginY = Math.min(0.05, leftoverHeight * 0.05);

                    const unallocatedGeo = new THREE.BoxGeometry(
                        buildingWidth - wallThickness - 0.2,
                        leftoverHeight - leftoverMarginY * 2,
                        buildingDepth - wallThickness - 0.2
                    );
                    const unallocatedBox = new THREE.Mesh(unallocatedGeo, unallocatedMaterial);
                    unallocatedBox.position.set(0, currentYOffset + (leftoverHeight / 2), buildingDepth / 2);

                    unallocatedBox.userData = {
                        type: "unallocated",
                        nodeName: node.name,
                        memoryGB: leftoverMemory,
                        nodeMaxMemory: node.maxMemoryGB
                    };
                    nodeBuilding.add(unallocatedBox);

                    // Sleek wireframe edge outlines for the unallocated/available space
                    const leftoverEdges = new THREE.EdgesGeometry(unallocatedGeo);
                    const leftoverLineMat = new THREE.LineBasicMaterial({ color: 0x4b5563, transparent: true, opacity: 0.4 });
                    const leftoverLine = new THREE.LineSegments(leftoverEdges, leftoverLineMat);
                    leftoverLine.position.copy(unallocatedBox.position);
                    nodeBuilding.add(leftoverLine);

                    currentYOffset += leftoverHeight;
                }

                scene.add(nodeBuilding);

                // Construct World Colliders from AABB Walls (Structural outer walls only)
                nodeBuilding.updateMatrixWorld(true);
                nodeBuilding.children.forEach((child) => {
                    if (child.geometry && child.geometry.type === 'BoxGeometry') {
                        // Only add actual physical walls as colliders, not partition floor slabs or pod boxes
                        if (child.userData && child.userData.type === 'node') {
                            const box = new THREE.Box3().setFromObject(child);
                            colliders.push(box);
                        }
                    }
                });
            });

            // Dynamically position player camera outside the cluster looking at its center
            if (minX !== Infinity && minZ !== Infinity) {
                const centerX = (minX + maxX) / 2;
                const spawnZ = minZ - 25;
                camera.position.set(centerX, 2.5, spawnZ);
                camera.lookAt(new THREE.Vector3(centerX, 2.5, 0));
            } else {
                camera.position.set(0, 2.5, -25);
                camera.lookAt(new THREE.Vector3(0, 2.5, 0));
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // AABB Collision Check Helpers
        const playerBox = new THREE.Box3();
        const playerRadius = 0.5; // Clearance distance from walls

        function checkCollision() {
            // Represent user's height and thickness
            playerBox.setFromCenterAndSize(
                new THREE.Vector3(camera.position.x, camera.position.y, camera.position.z),
                new THREE.Vector3(playerRadius * 2, 2.0, playerRadius * 2)
            );
            for (let i = 0; i < colliders.length; i++) {
                if (playerBox.intersectsBox(colliders[i])) {
                    return true;
                }
            }
            return false;
        }

        // 4. Game Animation & Camera Movement Loops
        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked === true) {
                const delta = clock.getDelta();

                // Damping friction simulation loops to make movement feel clean
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.y -= velocity.y * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.y = Number(moveUp) - Number(moveDown);
                direction.normalize();

                // Apply velocity values based on direction inputs
                if (moveForward || moveBackward) velocity.z -= direction.z * 100.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 100.0 * delta;
                if (moveUp || moveDown) velocity.y -= direction.y * 100.0 * delta;

                // Save previous camera position
                const prevPosition = camera.position.clone();

                // Apply proposed movement
                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                camera.position.y += -velocity.y * delta;

                // Ground plane boundary (minimum flying height)
                if (camera.position.y < 2.5) {
                    camera.position.y = 2.5;
                    velocity.y = 0;
                }

                // Sliding Collision Resolution
                if (checkCollision()) {
                    const proposedPosition = camera.position.clone();

                    // Try to keep X and Y movement but discard Z movement
                    camera.position.set(proposedPosition.x, proposedPosition.y, prevPosition.z);
                    if (checkCollision()) {
                        // Collides, so try keeping Z and Y movement but discarding X movement
                        camera.position.set(prevPosition.x, proposedPosition.y, proposedPosition.z);
                        if (checkCollision()) {
                            // Try keeping X and Z movement but discarding Y movement
                            camera.position.set(proposedPosition.x, prevPosition.y, proposedPosition.z);
                            if (checkCollision()) {
                                // All fail, fully revert
                                camera.position.copy(prevPosition);
                            }
                        }
                    }
                }
            }

            // Raycast for Look Tooltips
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            let hoveredObj = null;
            for (let i = 0; i < intersects.length; i++) {
                const obj = intersects[i].object;
                if (obj.userData && obj.userData.type) {
                    hoveredObj = obj;
                    break;
                }
            }

            const hud = document.getElementById('hud-tooltip');
            const crosshair = document.getElementById('crosshair');

            if (hoveredObj && controls.isLocked) {
                crosshair.classList.add('active');
                hud.classList.add('visible');

                const data = hoveredObj.userData;
                if (data.type === 'pod') {
                    const memoryPercentage = Math.round((data.memoryGB / data.nodeMaxMemory) * 100);
                    const formattedMemory = Math.round(data.memoryGB * 10) / 10;
                    const formattedCPU = data.cpuCores ? Math.round(data.cpuCores * 10) / 10 : null;
                    hud.innerHTML = `
                        <div class="hud-header">
                            <span class="hud-type">Pod Unit</span>
                            <span class="badge badge-${data.status.toLowerCase()}">${data.status}</span>
                        </div>
                        <div class="hud-title">${data.podName}</div>
                        <div style="margin-top: 16px;">
                            <div class="hud-meta-row">
                                <span class="hud-label">Namespace</span>
                                <span class="hud-value" style="font-family: 'JetBrains Mono', monospace;">${data.namespace}</span>
                            </div>
                            <div class="hud-meta-row">
                                <span class="hud-label">Memory Request</span>
                                <span class="hud-value">${formattedMemory}GB</span>
                            </div>
                            ${formattedCPU !== null ? `
                            <div class="hud-meta-row">
                                <span class="hud-label">CPU Request</span>
                                <span class="hud-value">${formattedCPU} Core${formattedCPU !== 1 ? 's' : ''}</span>
                            </div>
                            ` : ''}
                            <div class="hud-meta-row">
                                <span class="hud-label">Node Host</span>
                                <span class="hud-value">${data.nodeName}</span>
                            </div>
                            <div style="margin-top: 16px;">
                                <div style="display:flex; justify-content:space-between; font-size:12px; color:#94a3b8; margin-bottom: 4px;">
                                    <span>Memory Allocation Share</span>
                                    <span>${memoryPercentage}%</span>
                                </div>
                                <div class="resource-bar-container">
                                    <div class="resource-bar-fill" style="width: ${memoryPercentage}%; background: #${data.color.toString(16).padStart(6, '0')};"></div>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (data.type === 'node') {
                    const allocationPercentage = Math.round((data.allocatedMemory / data.maxMemoryGB) * 100);
                    const formattedMaxMemory = Math.round(data.maxMemoryGB * 10) / 10;
                    const formattedAllocatedMemory = Math.round(data.allocatedMemory * 10) / 10;
                    const formattedMaxCPU = data.maxCPUCores ? Math.round(data.maxCPUCores * 10) / 10 : null;
                    const formattedAllocatedCPU = data.allocatedCPU ? Math.round(data.allocatedCPU * 10) / 10 : null;
                    hud.innerHTML = `
                        <div class="hud-header">
                            <span class="hud-type" style="color: #10b981; background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.2);">Node</span>
                        </div>
                        <div class="hud-title">${data.nodeName}</div>
                        <div style="margin-top: 16px;">
                            <div class="hud-meta-row">
                                <span class="hud-label">Total Capacity</span>
                                <span class="hud-value">${formattedMaxMemory}GB</span>
                            </div>
                            <div class="hud-meta-row">
                                <span class="hud-label">Allocated Memory</span>
                                <span class="hud-value">${formattedAllocatedMemory}GB (${allocationPercentage}%)</span>
                            </div>
                            ${formattedMaxCPU !== null ? `
                            <div class="hud-meta-row">
                                <span class="hud-label">CPU Capacity</span>
                                <span class="hud-value">${formattedMaxCPU} Core${formattedMaxCPU !== 1 ? 's' : ''}</span>
                            </div>
                            <div class="hud-meta-row">
                                <span class="hud-label">Allocated CPU</span>
                                <span class="hud-value">${formattedAllocatedCPU || 0} Core${formattedAllocatedCPU !== 1 ? 's' : ''}</span>
                            </div>
                            ` : ''}
                            <div class="hud-meta-row">
                                <span class="hud-label">Running Pods</span>
                                <span class="hud-value">${data.podsCount}</span>
                            </div>
                            <div style="margin-top: 16px;">
                                <div style="display:flex; justify-content:space-between; font-size:12px; color:#94a3b8; margin-bottom: 4px;">
                                    <span>Total Capacity Allocated</span>
                                    <span>${allocationPercentage}%</span>
                                </div>
                                <div class="resource-bar-container">
                                    <div class="resource-bar-fill" style="width: ${allocationPercentage}%; background: linear-gradient(90deg, #10b981 0%, #3b82f6 100%);"></div>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (data.type === 'unallocated') {
                    const unallocatedPercentage = Math.round((data.memoryGB / data.nodeMaxMemory) * 100);
                    const formattedMemory = Math.round(data.memoryGB * 10) / 10;
                    hud.innerHTML = `
                        <div class="hud-header">
                            <span class="hud-type" style="color: #94a3b8; background: rgba(148, 163, 184, 0.15); border-color: rgba(148, 163, 184, 0.2);">Unallocated</span>
                        </div>
                        <div class="hud-title">Available Capacity</div>
                        <div style="margin-top: 16px;">
                            <div class="hud-meta-row">
                                <span class="hud-label">Parent Node</span>
                                <span class="hud-value">${data.nodeName}</span>
                            </div>
                            <div class="hud-meta-row">
                                <span class="hud-label">Available Size</span>
                                <span class="hud-value">${formattedMemory}GB</span>
                            </div>
                            <div style="margin-top: 16px;">
                                <div style="display:flex; justify-content:space-between; font-size:12px; color:#94a3b8; margin-bottom: 4px;">
                                    <span>Available Room Share</span>
                                    <span>${unallocatedPercentage}%</span>
                                </div>
                                <div class="resource-bar-container">
                                    <div class="resource-bar-fill" style="width: ${unallocatedPercentage}%; background: #4b5563;"></div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            } else {
                crosshair.classList.remove('active');
                hud.classList.remove('visible');
            }

            // Animate ocean waves over time
            if (oceanGeometry) {
                const time = clock.getElapsedTime();
                const position = oceanGeometry.attributes.position;
                for (let i = 0; i < position.count; i++) {
                    const u = position.getX(i);
                    const v = position.getY(i);
                    // Compute wave height using a multi-frequency sine wave
                    const z = Math.sin(u * 0.02 + time * 0.8) * 0.4 + Math.cos(v * 0.02 + time * 0.6) * 0.4;
                    position.setZ(i, z);
                }
                position.needsUpdate = true;
                oceanGeometry.computeVertexNormals();
            }

            // Billboard effect: Make sun glow rings face the player camera
            if (sunGroup && camera) {
                sunGroup.children.forEach((child) => {
                    if (child !== sunMesh) {
                        child.lookAt(camera.position);
                    }
                });
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
